<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Caption recorder</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="sidepanel-container">
      <!-- Top Header -->
      <header class="sidepanel-header">
        <div class="header-brand">
          <div class="brand-icon">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
            </svg>
          </div>
          <span class="brand-name">Caption recorder</span>
          <span id="brand-version" class="brand-badge">v1.1.0</span>
        </div>

        <div class="header-status">
          <div id="status-pill" class="status-pill status-idle">
            <span class="status-dot"></span>
            <span id="status-text" class="status-label">Idle</span>
          </div>
        </div>
      </header>

      <!-- Recovery Banner (Displayed if unsaved draft exists from a previous session) -->
      <div id="sec-recovery" class="recovery-banner" style="display: none">
        <div class="recovery-info">
          <div class="recovery-icon">
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
              <path d="M21 3v5h-5" />
              <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
              <path d="M8 16H3v5" />
            </svg>
          </div>
          <div class="recovery-text">
            <span id="txt-recovery-title" class="recovery-title">Unsaved Meeting</span>
            <span id="txt-recovery-desc" class="recovery-desc">Recorded session found</span>
          </div>
        </div>
        <div class="recovery-actions">
          <button id="btn-rec-export" class="btn btn-xs btn-primary">Export</button>
          <button id="btn-rec-discard" class="btn btn-xs btn-danger" title="Discard">
            Discard
          </button>
        </div>
      </div>

      <!-- Navigation Tabs -->
      <nav class="sidepanel-nav">
        <div class="tabs-group">
          <button class="nav-tab active" data-tab="live" id="tab-btn-live">
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M12 20h9" />
              <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
            </svg>
            <span id="tab-label-live">Live Transcript</span>
          </button>
          <button class="nav-tab" data-tab="export" id="tab-btn-export">
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="7 10 12 15 17 10" />
              <line x1="12" y1="15" x2="12" y2="3" />
            </svg>
            <span id="tab-label-export">Export</span>
          </button>
        </div>

        <button
          id="btn-new-meeting"
          class="btn-new-meeting"
          title="New Meeting"
          style="display: none"
        >
          <svg
            width="13"
            height="13"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <line x1="12" y1="5" x2="12" y2="19" />
            <line x1="5" y1="12" x2="19" y2="12" />
          </svg>
          <span id="btn-label-new-meeting">New</span>
        </button>
      </nav>

      <!-- Metrics Bar -->
      <div class="metrics-bar">
        <div class="metric-item">
          <span class="metric-label">Duration</span>
          <span id="val-duration" class="metric-value">0m 0s</span>
        </div>
        <div class="metric-item">
          <span class="metric-label">Speakers</span>
          <span id="val-speakers" class="metric-value">0</span>
        </div>
        <div class="metric-item">
          <span class="metric-label">Words</span>
          <span id="val-words" class="metric-value">0</span>
        </div>
        <div class="metric-item">
          <span class="metric-label">Turns</span>
          <span id="val-turns" class="metric-value">0</span>
        </div>
      </div>

      <!-- Main Content Area -->
      <main class="sidepanel-content">
        <!-- Tab 1: Live Transcript -->
        <section id="pane-live" class="pane-content active-pane">
          <div id="transcript-list" class="transcript-list">
            <div id="empty-state" class="empty-state">
              <div class="empty-icon">
                <svg
                  width="32"
                  height="32"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="#4f46e5"
                  stroke-width="1.75"
                >
                  <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                </svg>
              </div>
              <h3 id="txt-idle-title" class="empty-title">Ready for Meetings</h3>
              <p id="txt-idle-desc" class="empty-desc">
                Open Google Meet and turn on captions to start recording automatically.
              </p>
            </div>
          </div>
        </section>

        <!-- Tab 2: Export Pane -->
        <section id="pane-export" class="pane-content" style="display: none">
          <div class="export-container">
            <div class="export-card">
              <h3 id="txt-export-title" class="export-heading">Export Transcript</h3>
              <p class="export-subheading">
                Choose your preferred format to download your recording.
              </p>

              <div class="export-grid">
                <button class="export-btn" id="btn-exp-md">
                  <div class="export-btn-icon icon-md">
                    <svg
                      width="22"
                      height="22"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                    >
                      <path
                        d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"
                      />
                      <path d="M7 15V9l3 3 3-3v6M18 15l2-3h-4" />
                    </svg>
                  </div>
                  <span class="export-btn-label">Markdown (.md)</span>
                </button>

                <button class="export-btn" id="btn-exp-txt">
                  <div class="export-btn-icon icon-txt">
                    <svg
                      width="22"
                      height="22"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                    >
                      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                      <polyline points="14 2 14 8 20 8" />
                      <line x1="16" y1="13" x2="8" y2="13" />
                      <line x1="16" y1="17" x2="8" y2="17" />
                    </svg>
                  </div>
                  <span class="export-btn-label">Plain Text (.txt)</span>
                </button>

                <button class="export-btn" id="btn-exp-srt">
                  <div class="export-btn-icon icon-srt">
                    <svg
                      width="22"
                      height="22"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                    >
                      <rect x="2" y="4" width="20" height="16" rx="2" />
                      <path d="M10 9v6M14 9v6M6 12h12" />
                    </svg>
                  </div>
                  <span class="export-btn-label">Subtitles (.srt)</span>
                </button>

                <button class="export-btn" id="btn-exp-vtt">
                  <div class="export-btn-icon icon-vtt">
                    <svg
                      width="22"
                      height="22"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                    >
                      <rect x="2" y="4" width="20" height="16" rx="2" />
                      <path d="m8 10 2 5 2-5M15 10v5" />
                    </svg>
                  </div>
                  <span class="export-btn-label">WebVTT (.vtt)</span>
                </button>
              </div>

              <div class="export-actions">
                <button class="btn btn-secondary btn-copy" id="btn-copy-all">
                  <svg
                    width="15"
                    height="15"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <rect x="9" y="9" width="13" height="13" rx="2" />
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
                  </svg>
                  <span id="txt-copy-btn">Copy to Clipboard</span>
                </button>

                <button
                  class="btn btn-secondary btn-danger"
                  id="btn-reset-session"
                  style="display: none"
                >
                  <svg
                    width="14"
                    height="14"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path
                      d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"
                    />
                  </svg>
                  <span id="txt-discard-btn">Discard Session</span>
                </button>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="main.ts"></script>
  </body>
</html>
